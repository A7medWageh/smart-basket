name: Build Scan & Go Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd Scan-go-main
          flutter pub get

      - name: Build Android APK
        run: |
          cd Scan-go-main
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanGo-SmartBasket-Release-APK
          path: Scan-go-main/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Scan & Go Smart Basket App v1.0.0
          body: |
            🚀 **Scan & Go Smart Shopping Cart Mobile App**
            - Connected to Live Vercel Backend (`smart-basket-theta.vercel.app`)
            - Integrated with Hugging Face Cloud AI Vision (`wegoo-ai-bascket.hf.space`)
            - Supports automatic detection for `v7_can` and `big_chips`
          files: Scan-go-main/build/app/outputs/flutter-apk/app-release.apk
